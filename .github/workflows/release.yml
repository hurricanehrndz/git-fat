name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  EMBALA_VERSION: 0.3.0
  APPLE_CODESIGN_VERSION: 0.29.0
jobs:
  meta:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Resolve and check the version
        shell: bash
        run: |
          version=$(awk -F'"' '/^const version = / { print $2 }' cmd/git-fat/main.go)
          config_version=$(awk -F'"' '/^version = / { print $2; exit }' embala.toml)
          bump_version=$(awk -F'"' '/^version: / { print $2; exit }' versionbump.yaml)

          if [ -z "$version" ] || [ "$version" != "$config_version" ] || [ "$version" != "$bump_version" ]; then
            echo "::error::version mismatch: binary=$version embala=$config_version versionbump=$bump_version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: cachix/install-nix-action@v31
      # Same rustfs as ci.yml and the devshell: the nixpkgs rev in flake.lock.
      - name: Install RustFS from the flake.lock nixpkgs pin
        run: |
          rev=$(jq -er .nodes.nixpkgs.locked.rev flake.lock)
          out=$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/$rev#rustfs")
          "$out/bin/rustfs" --version | head -1
          echo "$out/bin" >> "$GITHUB_PATH"
      - run: go vet ./...
      - run: go test -tags integration ./...
  # Asset names carry the OS and arch so mise's github: backend can pick one;
  # each archive holds the binary at its root plus README.md and LICENSE.
  linux-windows:
    needs: [meta, verify]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build Linux archives
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          for target in amd64:x86_64:x86-64 arm64:aarch64:ARM.aarch64; do
            IFS=: read -r goarch arch filearch <<< "$target"
            dir="staging/linux-$arch"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$dir/git-fat" ./cmd/git-fat
            file "$dir/git-fat" | tee /dev/stderr | grep -q "ELF 64-bit.*$filearch.*statically linked"
            cp README.md LICENSE "$dir/"
            tar -czf "git-fat-$VERSION-linux-$arch.tar.gz" -C "$dir" git-fat README.md LICENSE
          done
      - name: Build Windows archive
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          dir=staging/windows-x86_64
          mkdir -p "$dir"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o "$dir/git-fat.exe" ./cmd/git-fat
          file "$dir/git-fat.exe" | tee /dev/stderr | grep -q "PE32+ executable.*x86-64"
          cp README.md LICENSE "$dir/"
          (cd "$dir" && zip -X "$GITHUB_WORKSPACE/git-fat-$VERSION-windows-x86_64.zip" git-fat.exe README.md LICENSE)
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows-release
          path: |
            git-fat-*-linux-*.tar.gz
            git-fat-*-windows-*.zip
          if-no-files-found: error
  # Darwin builds here, not on ubuntu, because the pkg's universal binary
  # needs lipo.
  macos:
    needs: [meta, verify]
    runs-on: macos-latest
    env:
      # Keep macOS tar from adding AppleDouble ._ entries to the archives.
      COPYFILE_DISABLE: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install pinned packaging tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/bin"

          embala_asset="embala-$EMBALA_VERSION-aarch64-apple-darwin.tar.gz"
          gh release download "v$EMBALA_VERSION" \
            --repo hurricanehrndz/embala \
            --pattern "$embala_asset" \
            --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/downloads"
          embala_sum=$(awk -v asset="$embala_asset" '$2 == asset { print $1 }' "$RUNNER_TEMP/downloads/SHA256SUMS")
          test -n "$embala_sum"
          test "$(shasum -a 256 "$RUNNER_TEMP/downloads/$embala_asset" | awk '{ print $1 }')" = "$embala_sum"
          tar -xzf "$RUNNER_TEMP/downloads/$embala_asset" \
            -C "$RUNNER_TEMP/bin" --strip-components=1

          codesign_asset="apple-codesign-$APPLE_CODESIGN_VERSION-macos-universal.tar.gz"
          gh release download "apple-codesign/$APPLE_CODESIGN_VERSION" \
            --repo indygreg/apple-platform-rs \
            --pattern "$codesign_asset" \
            --pattern "$codesign_asset.sha256" \
            --dir "$RUNNER_TEMP/downloads"
          codesign_sum=$(tr -d '[:space:]' < "$RUNNER_TEMP/downloads/$codesign_asset.sha256")
          test "$(shasum -a 256 "$RUNNER_TEMP/downloads/$codesign_asset" | awk '{ print $1 }')" = "$codesign_sum"
          tar -xzf "$RUNNER_TEMP/downloads/$codesign_asset" \
            -C "$RUNNER_TEMP/bin" --strip-components=1

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Write signing credentials
        env:
          APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_P12 }}
          APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_JSON: ${{ secrets.MACOS_NOTARY_API_KEY_JSON }}
        shell: bash
        run: |
          : "${APPLICATION_P12_BASE64:?MACOS_APPLICATION_CERTIFICATE_P12 is required}"
          : "${APPLICATION_P12_PASSWORD:?MACOS_APPLICATION_CERTIFICATE_PASSWORD is required}"
          : "${INSTALLER_P12_BASE64:?MACOS_INSTALLER_CERTIFICATE_P12 is required}"
          : "${INSTALLER_P12_PASSWORD:?MACOS_INSTALLER_CERTIFICATE_PASSWORD is required}"
          : "${NOTARY_API_KEY_JSON:?MACOS_NOTARY_API_KEY_JSON is required}"

          mkdir -p "$RUNNER_TEMP/signing"
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          signing = Path(os.environ["RUNNER_TEMP"]) / "signing"
          signing.joinpath("application.p12").write_bytes(
              base64.b64decode(os.environ["APPLICATION_P12_BASE64"], validate=True)
          )
          signing.joinpath("installer.p12").write_bytes(
              base64.b64decode(os.environ["INSTALLER_P12_BASE64"], validate=True)
          )
          # Output of `rcodesign encode-app-store-connect-api-key`; parse it so a
          # malformed secret fails here, not after the upload.
          key = json.loads(os.environ["NOTARY_API_KEY_JSON"])
          signing.joinpath("notary-api-key.json").write_text(json.dumps(key))
          PY
          printf '%s' "$APPLICATION_P12_PASSWORD" > "$RUNNER_TEMP/signing/application-password"
          printf '%s' "$INSTALLER_P12_PASSWORD" > "$RUNNER_TEMP/signing/installer-password"
          chmod 600 "$RUNNER_TEMP/signing/"*

          {
            echo "MACOS_APPLICATION_P12=$RUNNER_TEMP/signing/application.p12"
            echo "MACOS_APPLICATION_P12_PASSWORD_FILE=$RUNNER_TEMP/signing/application-password"
            echo "MACOS_INSTALLER_P12=$RUNNER_TEMP/signing/installer.p12"
            echo "MACOS_INSTALLER_P12_PASSWORD_FILE=$RUNNER_TEMP/signing/installer-password"
            echo "MACOS_NOTARY_API_KEY_FILE=$RUNNER_TEMP/signing/notary-api-key.json"
          } >> "$GITHUB_ENV"
      # The archives get the signed thin binaries and the pkg a lipo of the
      # same ones, so notarizing the pkg covers the archived binaries too:
      # notarization tickets are per code hash, not per file.
      - name: Build and sign darwin archives and the universal binary
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          for target in amd64:x86_64:x86_64 arm64:aarch64:arm64; do
            IFS=: read -r goarch arch filearch <<< "$target"
            dir="staging/darwin-$arch"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$dir/git-fat" ./cmd/git-fat
            file "$dir/git-fat" | tee /dev/stderr | grep -q "Mach-O 64-bit.*$filearch"
            rcodesign sign \
              --p12-file "$MACOS_APPLICATION_P12" \
              --p12-password-file "$MACOS_APPLICATION_P12_PASSWORD_FILE" \
              --binary-identifier com.github.hurricanehrndz.git-fat \
              --code-signature-flags runtime \
              "$dir/git-fat"
            codesign --verify --strict --verbose=2 "$dir/git-fat"
            cp README.md LICENSE "$dir/"
            tar -czf "git-fat-$VERSION-darwin-$arch.tar.gz" -C "$dir" git-fat README.md LICENSE
          done
          mkdir -p dist
          lipo -create \
            staging/darwin-aarch64/git-fat \
            staging/darwin-x86_64/git-fat \
            -output dist/git-fat-darwin-universal
          lipo dist/git-fat-darwin-universal -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures --verbose=2 dist/git-fat-darwin-universal
      # embala signs the pkg with the installer certificate; see [sign.macos]
      # in embala.toml.
      - name: Build the pkg with embala
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          chmod +x dist/git-fat-darwin-universal
          embala build --config embala.toml --formats pkg --out-dir release
          mv "release/git-fat-$VERSION.pkg" "git-fat-$VERSION-universal.pkg"
          pkgutil --payload-files "git-fat-$VERSION-universal.pkg" | tee /dev/stderr | grep -qx ./bin/git-fat
          pkgutil --check-signature "git-fat-$VERSION-universal.pkg"
      - name: Notarize and staple the pkg
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          pkg="git-fat-$VERSION-universal.pkg"
          rcodesign notary-submit \
            --api-key-file "$MACOS_NOTARY_API_KEY_FILE" \
            --max-wait-seconds 1800 \
            --staple \
            "$pkg"
          xcrun stapler validate "$pkg"
          spctl --assess --type install -vv "$pkg"
      # A bare binary cannot be stapled; Gatekeeper looks its ticket up
      # online, which this does too. Retried while Apple publishes the ticket.
      - name: Check the archived binaries are notarized
        run: |
          for bin in staging/darwin-*/git-fat; do
            for _ in 1 2 3 4 5 6; do
              if codesign --verify --check-notarization -R=notarized --verbose=2 "$bin"; then
                continue 2
              fi
              sleep 10
            done
            echo "::error::$bin is not notarized"
            exit 1
          done
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            git-fat-*-darwin-*.tar.gz
            git-fat-*-universal.pkg
          if-no-files-found: error
  release:
    needs: [meta, linux-windows, macos]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-windows-release
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: dist
      - name: Checksums
        run: cd dist && sha256sum git-fat-* | tee SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "git-fat $VERSION" \
            --generate-notes \
            dist/*
