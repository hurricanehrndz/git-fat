---
- id: gitfat-check
  name: gitfat-check
  description: Large (fat) file manager fatobj verifier
  entry: git-fat check
  language: golang
  stages: [pre-merge-commit, manual]
  minimum_pre_commit_version: 2.9.2
  verbose: true
  require_serial: true

- id: gitfat-check-new
  name: Check fatobjs are in fatstore
  description: Large (fat) file manager verifier for new fatobjs in branch
  pass_filenames: false
  # A hook's args replace these, so 1.x configs with args: [<ref>] still work.
  entry: git-fat check --base
  args: [master]
  language: golang
  stages: [pre-commit, manual]
  minimum_pre_commit_version: 2.9.2
  verbose: true
  require_serial: true
